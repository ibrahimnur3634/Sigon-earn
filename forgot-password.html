
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | SIGON EARN</title>
    <link rel="stylesheet" href="styl.css">
</head>
<body>

<div class="auth-container">
    <div class="auth-card">

        <h1><a href="index.html">SIGON <span>EARN</span></a></h1>

        <p class="subtitle">
            Reset your password securely.
        </p>

        <form id="resetForm">

            <label>Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your registered email"
                autocomplete="email"
                required
            >

            <button type="submit" id="resetBtn">
                Send Reset Link
            </button>

        </form>

        <p id="message" role="status" aria-live="polite"></p>

        <p class="login-link">
            Remember your password?
            <a href="login.html">Back to Login</a>
        </p>

    </div>
</div>

<script type="module">

import { auth } from "./firebase.js";

import {
    sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

const form = document.getElementById("resetForm");
const message = document.getElementById("message");
const button = document.getElementById("resetBtn");

form.addEventListener("submit", async (e) => {

    e.preventDefault();

    const email = document.getElementById("email").value.trim();

    try {

        button.disabled = true;
        button.textContent = "Sending...";
        message.textContent = "Please wait...";

        const continueUrl = new URL("login.html", window.location.href).href;
        await sendPasswordResetEmail(auth, email, {
            url: continueUrl,
            handleCodeInApp: false
        });

        message.textContent =
            "If an account exists for that email, a password reset link has been sent. Check your inbox.";

        form.reset();

    } catch (error) {

        console.error(error);

        const messages = {
            "auth/invalid-email": "Enter a valid email address.",
            "auth/too-many-requests": "Too many reset attempts. Please wait and try again.",
            "auth/operation-not-allowed": "Email and password authentication is disabled in Firebase settings.",
            "auth/unauthorized-continue-uri": "Password reset is not configured for this website domain. Contact support.",
            "auth/invalid-continue-uri": "Password reset is not configured for this website domain. Contact support.",
            "auth/missing-continue-uri": "Password reset is not configured for this website domain. Contact support.",
            "auth/network-request-failed": "Network error. Check your connection and try again."
        };
        message.textContent = messages[error.code]
            || "Unable to send the reset email. Please check the address and try again.";

    } finally {

        button.disabled = false;
        button.textContent = "Send Reset Link";

    }

});

</script>

</body>
</html>
