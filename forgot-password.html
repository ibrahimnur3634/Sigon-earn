
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | SIGON EARN</title>
    <link rel="stylesheet" href="styl.css">
</head>
<body>

<div class="auth-container">
    <div class="auth-card">

        <h1><a href="index.html">SIGON <span>EARN</span></a></h1>

        <p class="subtitle">
            Reset your password securely.
        </p>

        <form id="resetForm">

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your registered email"
                autocomplete="email"
                required
            >

            <button type="submit" id="resetBtn">
                Send Reset Link
            </button>

        </form>

        <p id="message" role="status" aria-live="polite"></p>

        <p class="login-link">
            Remember your password?
            <a href="login.html">Back to Login</a>
        </p>

    </div>
</div>

<script type="module">

import { auth, sendPasswordResetEmail } from "./firebase.js";

const form = document.getElementById("resetForm");
const message = document.getElementById("message");
const button = document.getElementById("resetBtn");
const emailInput = document.getElementById("email");
let requestInProgress = false;
let lastRequestedEmail = "";
let lastRequestedAt = 0;

emailInput.addEventListener("input", () => {
    if (emailInput.value.trim().toLowerCase() !== lastRequestedEmail) {
        button.disabled = false;
    }
});

form.addEventListener("submit", async (e) => {

    e.preventDefault();

    const email = emailInput.value.trim().toLowerCase();
    if (!emailInput.checkValidity()) {
        emailInput.reportValidity();
        return;
    }
    if (requestInProgress) {
        return;
    }
    if (email === lastRequestedEmail && Date.now() - lastRequestedAt < 60000) {
        message.textContent = "A reset request was just sent for this email. Please check your inbox before requesting another.";
        message.className = "message-error";
        return;
    }

    try {

        requestInProgress = true;
        button.disabled = true;
        button.textContent = "Sending...";
        message.textContent = "Please wait...";
        message.className = "";

        const continueUrl = new URL("reset-password.html", window.location.href).href;
        await sendPasswordResetEmail(auth, email, {
            url: continueUrl,
            handleCodeInApp: false
        });

        lastRequestedEmail = email;
        lastRequestedAt = Date.now();
        message.textContent =
            "If an account exists for that email, a password reset link has been sent. Check your inbox.";
        message.className = "message-success";

    } catch (error) {

        console.error(error);

        const messages = {
            "auth/invalid-email": "Enter a valid email address.",
            "auth/too-many-requests": "Too many reset attempts. Please wait and try again.",
            "auth/operation-not-allowed": "Email and password authentication is disabled in Firebase settings.",
            "auth/unauthorized-continue-uri": "Password reset is not configured for this website domain. Contact support.",
            "auth/invalid-continue-uri": "Password reset is not configured for this website domain. Contact support.",
            "auth/missing-continue-uri": "Password reset is not configured for this website domain. Contact support.",
            "auth/network-request-failed": "Network error. Check your connection and try again."
        };
        message.textContent = messages[error.code]
            || "Unable to send the reset email. Please check the address and try again.";
        message.className = "message-error";

    } finally {

        requestInProgress = false;
        button.disabled = email === lastRequestedEmail;
        button.textContent = "Send Reset Link";

    }

});

</script>

</body>
</html>
