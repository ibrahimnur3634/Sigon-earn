
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SIGON EARN</title>
    <link rel="stylesheet" href="styl.css">
</head>
<body>

<div class="auth-container">
    <div class="auth-card">

        <h1><a href="index.html">SIGON <span>EARN</span></a></h1>
        <p class="subtitle">Welcome back! Login to your account.</p>

        <form id="loginForm">

            <label>Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="loginBtn">
                Login to Account
            </button>

        </form>

        <p id="message" role="status" aria-live="polite"></p>

        <p class="login-link">
            <a href="forgot-password.html">Forgot Password?</a>
        </p>

        <p class="login-link">
            Don't have an account?
            <a href="register.html">Create Account</a>
        </p>

    </div>
</div>

<script type="module">

import { auth, loginUser, onAuthStateChanged } from "./firebase.js";

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const button = document.getElementById("loginBtn");
let loginInProgress = false;

function getLoginErrorMessage(error) {
    const messages = {
        "auth/invalid-credential": "The email or password is incorrect.",
        "auth/wrong-password": "The email or password is incorrect.",
        "auth/user-not-found": "The email or password is incorrect.",
        "auth/invalid-email": "Enter a valid email address.",
        "auth/user-disabled": "This account has been disabled. Contact support.",
        "auth/operation-not-allowed": "Email and password sign-in is disabled in Firebase Authentication settings.",
        "auth/too-many-requests": "Too many attempts. Please wait and try again.",
        "auth/network-request-failed": "Network error. Check your connection and try again."
    };

    return messages[error.code] || error.message || "Unable to log in. Please try again.";
}

onAuthStateChanged(auth, (user) => {
    if (user && !loginInProgress) {
        window.location.replace("dashboard.html");
    }
});

form.addEventListener("submit", async (e) => {

    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    loginInProgress = true;
    try {

        button.disabled = true;
        button.textContent = "Logging in...";
        message.textContent = "Checking your account...";

        await loginUser(email, password);

        message.textContent = "Login successful!";

        window.location.href = "dashboard.html";

    } catch (error) {
        message.textContent = getLoginErrorMessage(error);

    } finally {

        loginInProgress = false;
        button.disabled = false;
        button.textContent = "Login to Account";

    }

});

</script>

</body>
</html>
