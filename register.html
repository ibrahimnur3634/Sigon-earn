
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | SIGON EARN</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="auth-container">
    <div class="auth-card">
        <h1>SIGON <span>EARN</span></h1>
        <p class="subtitle">Create your account and start earning.</p>

        <form id="registerForm">
            <label>Full Name</label>
            <input type="text" id="fullName" placeholder="Enter your full name" required>

            <label>Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label>Phone Number</label>
            <input type="tel" id="phone" placeholder="+2547XXXXXXXX" required>

            <label>Password</label>
            <input type="password" id="password" placeholder="Create password" minlength="6" required>

            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm password" required>

            <button type="submit" id="registerBtn">Create Account</button>
        </form>

        <div id="recaptcha-container"></div>

        <div id="otpSection" hidden>
            <h3>Verify Your Phone</h3>
            <p>Enter the six-digit SMS verification code.</p>
            <input type="text" id="otp" maxlength="6" placeholder="Enter OTP">
            <button id="verifyBtn" type="button">Verify Phone</button>
        </div>

        <p id="message"></p>

        <p class="login-link">
            Already have an account?
            <a href="login.html">Login</a>
        </p>
    </div>
</div>

<script type="module">
import { registerUser, verifyRegistrationOTP } from "./firebase.js";

const form = document.getElementById("registerForm");
const message = document.getElementById("message");

let confirmation = null;
let registrationData = null;

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const fullName = document.getElementById("fullName").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        return;
    }

    if (!/^\+2547\d{8}$/.test(phone)) {
        message.textContent = "Enter a valid number, e.g. +254712345678";
        return;
    }

    try {
        message.textContent = "Creating your account...";

        registrationData = { fullName, email, phone, password };

        const result = await registerUser(fullName, email, phone, password);
        confirmation = result.confirmation;

        form.hidden = true;
        document.getElementById("otpSection").hidden = false;

        message.textContent = "Check your email and phone for verification.";

    } catch (error) {
        message.textContent = error.message;
    }
});

document.getElementById("verifyBtn").addEventListener("click", async () => {
    const code = document.getElementById("otp").value.trim();

    if (!confirmation || !/^\d{6}$/.test(code)) {
        message.textContent = "Enter a valid six-digit OTP.";
        return;
    }

    try {
        message.textContent = "Verifying your phone...";

        await verifyRegistrationOTP(
            confirmation,
            code,
            registrationData.fullName,
            registrationData.email,
            registrationData.phone
        );

        message.textContent = "Phone verified! Check your email and verify it before logging in.";

        setTimeout(() => {
            window.location.href = "login.html";
        }, 2500);

    } catch (error) {
        message.textContent = error.message;
    }
});
</script>

</body>
</html>
