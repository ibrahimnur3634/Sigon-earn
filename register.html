<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | SIGON EARN</title>
    <link rel="stylesheet" href="styl.css">
</head>
<body>

<div class="auth-container">
    <div class="auth-card">
        <h1><a href="index.html">SIGON <span>EARN</span></a></h1>
        <p class="subtitle">Create your account and start earning.</p>

        <form id="registerForm">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" placeholder="Enter your full name" autocomplete="name" maxlength="100" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" autocomplete="email" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="+2547XXXXXXXX" autocomplete="tel" inputmode="tel" required>

            <label for="password">Password</label>
            <div class="password-field">
                <input type="password" id="password" placeholder="Create a strong password" autocomplete="new-password" minlength="8" required aria-describedby="passwordRequirements">
                <button class="password-toggle" type="button" data-password-toggle="password" aria-label="Show password" aria-pressed="false">
                    <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
            <ul class="password-requirements" id="passwordRequirements" aria-label="Password requirements">
                <li data-password-rule="length">At least 8 characters</li>
                <li data-password-rule="uppercase">At least one uppercase letter</li>
                <li data-password-rule="lowercase">At least one lowercase letter</li>
                <li data-password-rule="number">At least one number</li>
                <li data-password-rule="special">At least one special character</li>
            </ul>

            <label for="confirmPassword">Confirm Password</label>
            <div class="password-field">
                <input type="password" id="confirmPassword" placeholder="Confirm password" autocomplete="new-password" required>
                <button class="password-toggle" type="button" data-password-toggle="confirmPassword" aria-label="Show password" aria-pressed="false">
                    <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>

            <button type="submit" id="registerBtn">Create Account</button>
            <button type="button" id="recoverProfileBtn" hidden>Repair My Account Profile</button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>

        <p class="login-link">
            Already have an account?
            <a href="login.html">Login</a>
        </p>
    </div>
</div>

<script type="module">
import {
    auth,
    getUserProfile,
    registerUser,
    normalizeKenyanPhoneNumber,
    onAuthStateChanged,
    recoverUserProfile
} from "./firebase.js";
import {
    attachPasswordToggles,
    isStrongPassword,
    updatePasswordRequirements
} from "./password-tools.js";

const form = document.getElementById("registerForm");
const passwordInput = document.getElementById("password");
const requirements = document.getElementById("passwordRequirements");
attachPasswordToggles(form);
passwordInput.addEventListener("input", () => updatePasswordRequirements(passwordInput, requirements));
const message = document.getElementById("message");
const registerButton = document.getElementById("registerBtn");
let registrationInProgress = false;

function getRegistrationErrorMessage(error) {
    if (error.registrationStage === "profile" || error.code?.startsWith("firestore/")) {
        if (error.code === "firestore/permission-denied") {
            return "Your account is signed in, but Firestore denied profile creation. The project administrator must deploy the updated firestore.rules permissions.";
        }
        if (error.code === "firestore/not-found"
            || error.code === "firestore/failed-precondition"
            || /database.*(not found|does not exist)|no database/i.test(error.cause?.message || "")) {
            return "Your account is signed in, but the Firestore database is missing or not ready. Create the project's Cloud Firestore database in Firebase Console, then retry profile repair.";
        }
        if (error.code === "firestore/unavailable" || error.code === "firestore/deadline-exceeded") {
            return "Your account is signed in, but Firestore could not be reached. Check your connection and retry profile repair.";
        }
        if (error.code === "firestore/invalid-argument") {
            return "Your account is signed in, but Firestore rejected profile data. Check the name and Kenyan phone number, then retry.";
        }
        return `Your account is signed in, but the Firestore profile could not be saved (${error.code || "unknown Firestore error"}). Retry profile repair or contact support.`;
    }

    const messages = {
        "auth/email-already-in-use": "An account already exists for this email. Please log in instead.",
        "auth/invalid-email": "Enter a valid email address.",
        "auth/weak-password": "Choose a stronger password with at least eight characters.",
        "auth/operation-not-allowed": "Email and password registration is disabled in Firebase Authentication settings.",
        "auth/too-many-requests": "Too many attempts. Please wait and try again.",
        "auth/network-request-failed": "Network error. Check your connection and try again.",
        "app/missing-user-profile": "Your account is signed in, but its profile is missing. Enter your name and phone number, then use profile repair."
    };

    return messages[error.code] || "Unable to complete registration. Please try again.";
}

function getProfileDetails() {
    const fullName = document.getElementById("fullName").value.trim();
    const email = document.getElementById("email").value.trim();
    const phoneInput = document.getElementById("phone").value.trim();

    if (fullName.length < 2 || fullName.length > 100) {
        throw new Error("Enter a name between 2 and 100 characters.");
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        throw new Error("Enter a valid email address.");
    }
    return { fullName, email, phone: normalizeKenyanPhoneNumber(phoneInput) };
}

function logRegistrationError(error) {
    if (error.registrationStage === "profile" || error.code?.startsWith("firestore/")) {
        console.error("Registration profile operation failed.", {
            firebaseCode: error.code,
            details: error.cause?.message || error.message
        });
    } else {
        console.error("Registration failed.", { firebaseCode: error.code || "unknown" });
    }
}

onAuthStateChanged(auth, async (user) => {
    if (!user || registrationInProgress) {
        return;
    }

    try {
        const profile = await getUserProfile(user.uid);
        if (profile.exists()) {
            window.location.replace("dashboard.html");
            return;
        }

        document.getElementById("email").value = user.email || "";
        message.textContent = "You are signed in, but your profile is incomplete. Enter your name and phone number, then repair your profile.";
        message.className = "message-error";
        document.getElementById("recoverProfileBtn").hidden = false;
    } catch (error) {
        logRegistrationError(error);
        message.textContent = getRegistrationErrorMessage({
            code: error.code,
            cause: error,
            registrationStage: "profile"
        });
        message.className = "message-error";
        document.getElementById("recoverProfileBtn").hidden =
            error.code !== "firestore/permission-denied";
    }
});

form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    let phone;
    let fullName;
    let email;
    try {
        const details = getProfileDetails();
        ({ fullName, email, phone } = details);
    } catch (error) {
        message.textContent = error.message;
        message.className = "message-error";
        return;
    }

    if (!isStrongPassword(password)) {
        message.textContent = "Use at least 8 characters, including uppercase and lowercase letters, a number, and a symbol.";
        message.className = "message-error";
        return;
    }

    if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        message.className = "message-error";
        return;
    }

    registrationInProgress = true;
    registerButton.disabled = true;
    message.textContent = "Creating your account...";
    message.className = "";

    try {
        await registerUser(fullName, email, phone, password);
        message.textContent = "Your account and profile are ready. Redirecting to your dashboard...";
        window.location.replace("dashboard.html");
    } catch (error) {
        logRegistrationError(error);
        message.textContent = getRegistrationErrorMessage(error);
        message.className = "message-error";
        document.getElementById("recoverProfileBtn").hidden =
            error.registrationStage !== "profile";
    } finally {
        registrationInProgress = false;
        registerButton.disabled = false;
    }
});

document.getElementById("recoverProfileBtn").addEventListener("click", async () => {
    const recoverButton = document.getElementById("recoverProfileBtn");
    try {
        const { fullName, email, phone } = getProfileDetails();
        registrationInProgress = true;
        recoverButton.disabled = true;
        message.textContent = "Repairing your Firestore profile...";
        message.className = "";

        await recoverUserProfile(fullName, email, phone);
        message.textContent = "Your account profile is ready. Redirecting to your dashboard...";
        window.location.replace("dashboard.html");
    } catch (error) {
        logRegistrationError(error);
        message.textContent = getRegistrationErrorMessage(error);
        message.className = "message-error";
    } finally {
        registrationInProgress = false;
        recoverButton.disabled = false;
    }
});
</script>

</body>
</html>
