<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | SIGON EARN</title>
    <link rel="stylesheet" href="styl.css">
</head>
<body>
<main class="auth-container">
    <section class="auth-card" aria-labelledby="pageTitle">
        <h1 id="pageTitle"><a href="index.html">SIGON <span>EARN</span></a></h1>
        <p class="subtitle" id="subtitle">Choose a new password for your account.</p>

        <form id="newPasswordForm" hidden>
            <label for="newPassword">New Password</label>
            <div class="password-field">
                <input type="password" id="newPassword" autocomplete="new-password" minlength="8" required aria-describedby="passwordRequirements">
                <button class="password-toggle" type="button" data-password-toggle="newPassword" aria-label="Show password" aria-pressed="false">
                    <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
            <ul class="password-requirements" id="passwordRequirements" aria-label="Password requirements">
                <li data-password-rule="length">At least 8 characters</li>
                <li data-password-rule="uppercase">At least one uppercase letter</li>
                <li data-password-rule="lowercase">At least one lowercase letter</li>
                <li data-password-rule="number">At least one number</li>
                <li data-password-rule="special">At least one special character</li>
            </ul>

            <label for="confirmNewPassword">Confirm New Password</label>
            <div class="password-field">
                <input type="password" id="confirmNewPassword" autocomplete="new-password" required>
                <button class="password-toggle" type="button" data-password-toggle="confirmNewPassword" aria-label="Show password" aria-pressed="false">
                    <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
            <button type="submit" id="savePasswordButton">Save New Password</button>
        </form>

        <p id="message" role="status" aria-live="polite">Checking your reset link...</p>
        <p class="login-link" id="returnLink" hidden>
            <a href="login.html">Return to Login</a>
        </p>
        <p class="login-link" id="requestNewLink" hidden>
            <a href="forgot-password.html">Request a new reset link</a>
        </p>
    </section>
</main>

<script type="module">
import {
    auth,
    confirmPasswordReset,
    verifyPasswordResetCode
} from "./firebase.js";
import {
    attachPasswordToggles,
    isStrongPassword,
    updatePasswordRequirements
} from "./password-tools.js";

const form = document.getElementById("newPasswordForm");
const passwordInput = document.getElementById("newPassword");
const confirmInput = document.getElementById("confirmNewPassword");
const requirements = document.getElementById("passwordRequirements");
const message = document.getElementById("message");
const returnLink = document.getElementById("returnLink");
const requestNewLink = document.getElementById("requestNewLink");
const submitButton = document.getElementById("savePasswordButton");
const params = new URLSearchParams(window.location.search);
const actionCode = params.get("oobCode");
let resetCodeIsValid = false;
let resetInProgress = false;

attachPasswordToggles(form);
passwordInput.addEventListener("input", () => updatePasswordRequirements(passwordInput, requirements));

function showLinkError(error) {
    requestNewLink.hidden = false;
    if (error.code === "auth/expired-action-code") {
        message.textContent = "This password reset link has expired. Request a new reset email and try again.";
        message.className = "message-error";
        return;
    }

    message.textContent = "This password reset link is invalid or has already been used. Request a new reset email to continue.";
    message.className = "message-error";
}

async function validateResetLink() {
    if (params.get("mode") !== "resetPassword" || !actionCode) {
        message.textContent = "This password reset link is incomplete or invalid. Request a new reset email to continue.";
        message.className = "message-error";
        requestNewLink.hidden = false;
        return;
    }

    try {
        await verifyPasswordResetCode(auth, actionCode);
        resetCodeIsValid = true;
        form.hidden = false;
        message.textContent = "";
        message.className = "";
    } catch (error) {
        console.error("Password reset link validation failed:", error);
        showLinkError(error);
    }
}

form.addEventListener("submit", async (event) => {
    event.preventDefault();
    if (!resetCodeIsValid || resetInProgress) {
        return;
    }

    const password = passwordInput.value;
    const confirmation = confirmInput.value;
    if (!isStrongPassword(password)) {
        message.textContent = "Meet all five password requirements before continuing.";
        message.className = "message-error";
        passwordInput.focus();
        return;
    }
    if (password !== confirmation) {
        message.textContent = "The confirmation password does not match.";
        message.className = "message-error";
        confirmInput.focus();
        return;
    }

    resetInProgress = true;
    submitButton.disabled = true;
    submitButton.textContent = "Saving...";
    message.textContent = "Updating your password securely...";
    message.className = "";

    try {
        await confirmPasswordReset(auth, actionCode, password);
        form.hidden = true;
        message.textContent = "Your password has been reset successfully. You can now log in with your new password.";
        message.className = "message-success";
        returnLink.hidden = false;
    } catch (error) {
        console.error("Password reset failed:", error);
        if (error.code === "auth/weak-password") {
            message.textContent = "Choose a stronger password that meets all the listed requirements.";
            message.className = "message-error";
        } else if (error.code === "auth/expired-action-code" || error.code === "auth/invalid-action-code") {
            showLinkError(error);
            message.className = "message-error";
            form.hidden = true;
        } else if (error.code === "auth/network-request-failed") {
            message.textContent = "Network error. Check your connection and try again.";
            message.className = "message-error";
        } else {
            message.textContent = "Unable to update your password. Please try again or request a new reset link.";
            message.className = "message-error";
        }
    } finally {
        resetInProgress = false;
        submitButton.disabled = false;
        submitButton.textContent = "Save New Password";
    }
});

validateResetLink();
</script>
</body>
</html>
